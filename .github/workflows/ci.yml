name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...

  image:
    # Only main builds and publishes the image.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        # GitHub Container Registry names must be lower case.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Turn this on by setting the repository variable DEPLOY to "true".
    if: github.event_name == 'push' && vars.DEPLOY == 'true'
    needs: image
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    permissions:
      contents: read
    env:
      TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/srv/hashtag-index' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install cloudflared
        run: |
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 cloudflared /usr/local/bin/cloudflared
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONF
          Host target
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ProxyCommand cloudflared access ssh --hostname %h
          CONF
      - name: Deploy
        run: |
          set -euo pipefail
          ssh target "mkdir -p '$DEPLOY_DIR/data' && chown 10001:10001 '$DEPLOY_DIR/data' && test -f '$DEPLOY_DIR/.env' || { echo 'missing $DEPLOY_DIR/.env' >&2; exit 1; }"
          ssh target "cat > '$DEPLOY_DIR/docker-compose.yml'" < docker-compose.yml
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh target "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          ssh target "cd '$DEPLOY_DIR' && docker compose pull && docker compose up -d && docker image prune -f; docker logout ghcr.io"
